<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>DomainScan</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="panel">

    <header class="header">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" focusable="false">
            <rect x="1.6" y="1.6" width="14.8" height="14.8" rx="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="9" cy="9" r="2.4" fill="currentColor"/>
          </svg>
        </span>
        <span class="name" id="brand-name"></span>
      </div>

      <span class="spacer"></span>

      <span class="live" id="live" role="status">
        <span class="dot" id="live-dot" aria-hidden="true"></span>
        <span class="label" id="live-label"></span>
      </span>

      <div class="menu-wrap">
        <button class="icon-btn" type="button" id="settings-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="settings-menu">
          <span class="sr-only" id="settings-label"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
          </svg>
        </button>
        <div class="menu" id="settings-menu" role="menu" aria-labelledby="settings-btn" hidden>
          <button class="menu-item" type="button" id="toggle-pause" role="menuitem"></button>
          <button class="menu-item" type="button" id="toggle-apis" role="menuitem"></button>
          <button class="menu-item" type="button" id="toggle-site" role="menuitem"></button>
          <button class="menu-item danger" type="button" id="clear-btn" role="menuitem"></button>
        </div>
      </div>
    </header>

    <main class="body" id="body">

      <section class="meta">
        <p class="eyebrow" id="eyebrow"></p>
        <div class="site">
          <h1 class="site-host" id="site-host"></h1>
          <span class="site-count" id="site-count"></span>
        </div>
        <p class="record-since" id="record-since"></p>
      </section>

      <aside class="note" id="fp-note" aria-labelledby="fp-title" hidden>
        <span class="ni" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/>
          </svg>
        </span>
        <div class="note-body">
          <div class="note-head">
            <span class="note-title" id="fp-title"></span>
            <span class="note-tag" id="fp-tag"></span>
          </div>
          <p class="note-text" id="fp-body"></p>
          <ul class="signal-list" id="signal-list"></ul>
        </div>
      </aside>

      <div class="controls">
        <label class="search">
          <span class="sr-only" id="search-label"></span>
          <span class="si" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
            </svg>
          </span>
          <input id="search" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
        </label>

        <div class="mode">
          <span class="mode-label" id="mode-label"></span>
          <div class="seg" role="group" aria-labelledby="mode-label">
            <button type="button" class="seg-btn" data-mode="exact" aria-pressed="true"></button>
            <button type="button" class="seg-btn" data-mode="collapse" aria-pressed="false"></button>
            <button type="button" class="seg-btn" data-mode="registrable" aria-pressed="false"></button>
          </div>
          <p class="mode-help" id="mode-help"></p>
        </div>
      </div>

      <ul class="list" id="list"></ul>

    </main>

    <footer class="footer">
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
      <div class="copy-actions">
        <button class="act primary" type="button" id="copy-domains"></button>
        <button class="act secondary" type="button" id="copy-ips"></button>
        <button class="act wide" type="button" id="copy-selected" disabled></button>
      </div>
    </footer>

  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
